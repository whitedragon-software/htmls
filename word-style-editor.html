<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Untitled document - Lite Writer</title>

<!-- =====================================================================
     DOCUMENT STYLES
     Everything that styles the *content* of a document lives here, scoped
     to ".doc". The same rules are embedded into exported HTML / DOC files,
     so exports look like the editor.
     ===================================================================== -->
<style id="docStyle">
.doc{font:11pt/1.15 Calibri,Carlito,"Segoe UI",Arial,sans-serif;color:var(--text,#000);overflow-wrap:anywhere}
.doc p{margin:0 0 8pt}
.doc h1,.doc h2,.doc h3{font-family:"Calibri Light",Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-weight:400;color:var(--heading,#2f5496)}
.doc h1{font-size:16pt;margin:12pt 0 0;line-height:1.2}
.doc h2{font-size:13pt;margin:2pt 0 0;line-height:1.2}
.doc h3{font-size:12pt;margin:2pt 0 0;line-height:1.2}
.doc p.title{font:300 28pt/1.1 "Calibri Light",Calibri,Carlito,"Segoe UI",Arial,sans-serif;margin:0 0 8pt}
.doc p.subtitle{font-size:13pt;color:var(--muted,#5a5a5a);letter-spacing:.5pt}
.doc p.quote{font-style:italic;color:var(--muted,#404040);text-align:center;margin:10pt 36pt}
.doc ul,.doc ol{margin:0 0 8pt;padding-left:36px}
.doc a{color:var(--link,#0563c1);text-decoration:underline}
.doc table{border-collapse:collapse;width:100%;table-layout:fixed;margin:0 0 8pt}
.doc td,.doc th{border:1px solid var(--tborder,#8a8a8a);padding:4px 7px;vertical-align:top;min-width:20px;overflow-wrap:anywhere}
.doc img{max-width:100%;height:auto}
.doc hr{border:0;border-top:1px solid var(--tborder,#8a8a8a);margin:12pt 0}
.doc .page-break{height:0;border-top:1px dashed #999;margin:18pt 0;break-after:page;page-break-after:always}
.doc blockquote{margin:0 0 0 40px}
</style>

<!-- =====================================================================
     APPLICATION STYLES (theme variables, ribbon, status bar, popups)
     ===================================================================== -->
<style>
/* ---------- Theme variables (light is default) ---------- */
:root{
  --title:#2b579a; --tab-active-text:#2b579a;
  --ribbon:#f3f3f3; --ribbon-text:#262626; --border:#d4d4d4; --hover:#e1e1e1;
  --active:#cfdcf0; --accent:#2b579a; --bg:#e6e6e6; --paper:#fff; --text:#1f1f1f;
  --muted:#666; --heading:#2f5496; --tborder:#8a8a8a; --link:#0563c1;
  --pageline:#ececec; --status:#2b579a; --input-bg:#fff; --menu:#fff;
}
:root[data-theme="dark"]{
  --title:#1f3a6b; --tab-active-text:#9bbcf5;
  --ribbon:#2b2b2b; --ribbon-text:#e6e6e6; --border:#454545; --hover:#3a3a3a;
  --active:#3d5a8a; --accent:#8ab4f8; --bg:#1b1b1b; --paper:#262626; --text:#e8e8e8;
  --muted:#a0a0a0; --heading:#8fb4f0; --tborder:#6a6a6a; --link:#8ab4f8;
  --pageline:#323232; --status:#1f3a6b; --input-bg:#1f1f1f; --menu:#2f2f2f;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ribbon-text);
  font:13px "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
.hide{display:none!important}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;pointer-events:none}

/* ---------- Header: title bar + tabs (sticky) ---------- */
#head{flex:none;position:sticky;top:0;z-index:20;background:var(--title);color:#fff}
#titlebar{display:flex;align-items:center;gap:4px;padding:4px 10px;height:36px}
#titlebar .rb{color:#fff;height:28px}
#titlebar .rb:hover{background:rgba(255,255,255,.18)}
#titlebar .rb.active{background:rgba(255,255,255,.28);border-color:transparent}
#titlebar .app{display:inline-flex;margin-right:6px}
#docTitle{flex:1;min-width:60px;max-width:420px;margin:0 auto;background:transparent;border:1px solid transparent;
  color:#fff;text-align:center;padding:3px 8px;border-radius:3px}
#docTitle:hover,#docTitle:focus{background:rgba(255,255,255,.16);outline:none}
#tabs{display:flex;gap:1px;padding:0 8px;overflow-x:auto}
.tab{background:transparent;border:0;border-radius:0;color:#fff;padding:6px 16px;cursor:pointer;white-space:nowrap}
.tab:hover{background:rgba(255,255,255,.16)}
.tab.active{background:var(--ribbon);color:var(--tab-active-text)}
.tab.file{background:rgba(0,0,0,.22);font-weight:600}
.tab.ctx{color:#ffe08a}
.tab.ctx.active{color:var(--tab-active-text)}

/* ---------- Ribbon ---------- */
#ribbon{flex:none;background:var(--ribbon);color:var(--ribbon-text);border-bottom:1px solid var(--border);overflow-x:auto;overflow-y:hidden}
.panel{display:none;min-height:92px;padding:3px 4px;width:max-content;min-width:100%}
.panel.active{display:flex}
.group{display:flex;flex-direction:column;padding:2px 8px 0;border-right:1px solid var(--border)}
.group .gi{flex:1;display:flex;align-items:center;gap:2px}
.group .gl{text-align:center;font-size:11px;color:var(--muted);padding:3px 0 2px;white-space:nowrap}
.rows{display:flex;flex-direction:column;gap:4px}
.line{display:flex;align-items:center;gap:1px}
.rb{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:3px;height:28px;min-width:28px;padding:0 5px;
  border:1px solid transparent;border-radius:3px;background:transparent;cursor:pointer;color:var(--ribbon-text);font-size:12px;white-space:nowrap;flex:none}
.rb:hover{background:var(--hover)}
.rb.active{background:var(--active);border-color:var(--accent)}
.rb.big{flex-direction:column;height:66px;min-width:56px;gap:4px;padding:5px 6px}
.rb.big svg.i{width:30px;height:30px}
.rb.arrow{width:14px;min-width:14px;padding:0}
.rb.arrow svg.i{width:10px;height:10px}
.split{display:inline-flex}
.bar{position:absolute;left:6px;right:6px;bottom:2px;height:3px;background:#f00;pointer-events:none}
.ctl{height:26px;border:1px solid var(--border);background:var(--input-bg);color:var(--ribbon-text);border-radius:3px;padding:0 5px;font-size:12px}
.ctl:focus{outline:1px solid var(--accent)}
.gallery{display:flex;gap:3px;max-width:400px;overflow-x:auto;padding:2px}
.tile{width:68px;height:58px;flex:none;border:1px solid var(--border);background:var(--paper);color:var(--text);border-radius:3px;cursor:pointer;
  display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;padding:4px 6px;text-align:left;overflow:hidden}
.tile:hover{border-color:var(--accent)}
.tile.active{outline:2px solid var(--accent)}
.tile .nm{font-size:10px;color:var(--muted);margin-top:2px}

/* ---------- Page area ---------- */
#main{flex:1;min-height:0;position:relative;display:flex}
#workspace{flex:1;overflow:auto;padding:22px 12px 48px}
#page{width:816px;min-height:1056px;margin:0 auto;box-shadow:0 1px 5px rgba(0,0,0,.35);
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 1055px,var(--pageline) 1055px,var(--pageline) 1056px),var(--paper)}
#editor{min-height:1056px;padding:96px;outline:none}
#editor img{cursor:pointer}
#editor img[data-sel]{outline:2px solid var(--accent)}
#editor .page-break{position:relative}
#editor .page-break::after{content:"Page Break";position:absolute;left:50%;top:-9px;transform:translateX(-50%);background:var(--paper);color:var(--muted);font:11px "Segoe UI",Arial,sans-serif;padding:0 8px}
body.web #page{width:100%;max-width:none;box-shadow:none;background:var(--paper)}
body.web #editor{padding:36px 8%}
::highlight(lw-find){background:#fff2a8;color:#000}
::highlight(lw-cur){background:#ff9632;color:#000}

/* ---------- Status bar ---------- */
#status{flex:none;display:flex;align-items:center;gap:16px;padding:3px 12px;background:var(--status);color:#fff;font-size:12px;min-height:26px;white-space:nowrap;overflow-x:auto}
#status .grow{flex:1}
#saveDot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#7ee07e;margin-right:6px}
#saveDot.busy{background:#ffd666}
#zoomBox{display:flex;align-items:center;gap:6px}
#zoomBox input{width:110px}
.zb{background:transparent;border:0;color:#fff;cursor:pointer;font-size:16px;line-height:1;padding:0 4px;border-radius:3px}
.zb:hover{background:rgba(255,255,255,.2)}

/* ---------- Popups, menus, palettes ---------- */
.popup{display:none;position:fixed;z-index:60;background:var(--menu);color:var(--ribbon-text);border:1px solid var(--border);box-shadow:0 4px 14px rgba(0,0,0,.3);border-radius:3px;min-width:140px}
.popup.open{display:block}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:7px 18px 7px 10px;border:0;background:none;text-align:left;cursor:pointer;color:inherit;position:relative;border-radius:0}
.mi:hover{background:var(--hover)}
.mi svg.i{color:var(--accent)}
.mdiv{height:1px;background:var(--border);margin:4px 0}
.pal-title{padding:7px 10px 0;font-size:11px;color:var(--muted)}
.pal{display:grid;gap:3px;padding:6px 10px}
.sw{width:20px;height:20px;padding:0;min-width:0;border:1px solid rgba(128,128,128,.55);border-radius:2px;cursor:pointer}
.sw:hover{outline:2px solid var(--accent)}
.tgrid{display:grid;grid-template-columns:repeat(10,18px);gap:2px;padding:8px}
.tg{width:18px;height:18px;border:1px solid var(--border);background:var(--paper)}
.tg.on{background:var(--active);border-color:var(--accent)}
.tlabel{padding:0 10px 8px;font-size:12px;color:var(--muted)}
.sgrid{display:grid;grid-template-columns:repeat(8,30px);gap:2px;padding:8px}
.sgrid button{height:30px;border:1px solid transparent;background:none;border-radius:3px;cursor:pointer;font-size:16px}
.sgrid button:hover{background:var(--hover);border-color:var(--border)}

/* ---------- Find bar ---------- */
#findbar{display:none;position:absolute;right:24px;top:10px;z-index:30;width:min(350px,92%);background:var(--menu);color:var(--ribbon-text);
  border:1px solid var(--border);box-shadow:0 4px 14px rgba(0,0,0,.3);border-radius:4px;padding:8px}
#findbar.open{display:block}
#findbar .frow{display:flex;align-items:center;gap:4px;margin-bottom:6px}
#findbar .frow .ctl{flex:1;min-width:0}
#findbar label{font-size:12px;display:flex;align-items:center;gap:6px}
#fCount{font-size:11px;color:var(--muted);min-width:46px;text-align:center}

/* ---------- Modal dialog ---------- */
#modalRoot{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);align-items:center;justify-content:center;z-index:100}
#modalRoot.open{display:flex}
.dlg{background:var(--menu);color:var(--ribbon-text);width:min(420px,92vw);border-radius:6px;padding:18px 20px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.dlg h3{margin:0 0 12px;font-size:16px;font-weight:600}
.dlg label{display:block;margin-bottom:10px;font-size:12px}
.dlg .ctl{display:block;width:100%;height:32px;margin-top:4px;font-size:13px}
.dlg .err{color:#d13438;font-size:12px;min-height:16px}
.dfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.btn{height:30px;padding:0 16px;border:1px solid var(--border);background:var(--ribbon);border-radius:3px;cursor:pointer}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#111}

/* ---------- Responsive (phones / small tablets) ---------- */
@media (max-width:860px){
  #page{width:100%!important;zoom:1!important;min-height:0;background:var(--paper)!important;box-shadow:none}
  #editor{padding:26px 18px;min-height:65vh}
  #workspace{padding:0 0 24px}
  #zoomBox{display:none}
  .tab{padding:6px 12px}
}

/* ---------- Print (Export as PDF) ---------- */
@page{margin:.8in}
@media print{
  :root,:root[data-theme="dark"]{--paper:#fff;--text:#000;--muted:#5a5a5a;--heading:#2f5496;--tborder:#8a8a8a;--link:#0563c1}
  html,body{height:auto;overflow:visible;background:#fff}
  #head,#status,.popup,#findbar,#modalRoot{display:none!important}
  #main,#workspace{display:block;overflow:visible;padding:0}
  #page{width:auto!important;min-height:0;zoom:1!important;box-shadow:none;background:#fff!important}
  #editor{padding:0;min-height:0}
  #editor .page-break{border:0;margin:0}
  #editor .page-break::after{display:none}
}
</style>
</head>
<body>

<!-- ===================== HEADER ===================== -->
<header id="head">
  <div id="titlebar">
    <span class="app" data-icon="doc"></span>
    <button class="rb" data-action="save" data-icon="save" title="Save (Ctrl+S)" aria-label="Save"></button>
    <button class="rb" data-cmd="undo" data-icon="undo" title="Undo (Ctrl+Z)" aria-label="Undo"></button>
    <button class="rb" data-cmd="redo" data-icon="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"></button>
    <input id="docTitle" value="Untitled document" aria-label="Document title" spellcheck="false">
    <button class="rb" data-action="theme" data-icon="contrast" title="Toggle dark / light mode" aria-label="Toggle theme"></button>
  </div>
  <nav id="tabs">
    <button class="tab file" data-popup="file">File</button>
    <button class="tab active" data-tab="home">Home</button>
    <button class="tab" data-tab="insert">Insert</button>
    <button class="tab" data-tab="view">View</button>
    <button class="tab ctx hide" id="tabTable" data-tab="table">Table Layout</button>
    <button class="tab ctx hide" id="tabPicture" data-tab="picture">Picture Format</button>
  </nav>
</header>

<!-- ===================== RIBBON ===================== -->
<div id="ribbon">

  <!-- HOME -->
  <div class="panel active" data-panel="home">
    <div class="group">
      <div class="gi"><div class="rows">
        <div class="line"><button class="rb" data-cmd="undo" data-icon="undo" title="Undo (Ctrl+Z)"></button></div>
        <div class="line"><button class="rb" data-cmd="redo" data-icon="redo" title="Redo (Ctrl+Shift+Z)"></button></div>
      </div></div>
      <div class="gl">Undo</div>
    </div>

    <div class="group">
      <div class="gi"><div class="rows">
        <div class="line">
          <select id="selFont" class="ctl" style="width:150px" title="Font"></select>
          <input id="inpSize" class="ctl" style="width:46px;text-align:center;margin-left:3px" title="Font size (pt)" inputmode="numeric" value="11">
          <button class="rb arrow" data-popup="sizes" data-icon="chev" title="Font size list" aria-label="Font size list"></button>
          <button class="rb" data-action="grow" data-icon="grow" title="Increase font size (Ctrl+])"></button>
          <button class="rb" data-action="shrink" data-icon="shrink" title="Decrease font size (Ctrl+[)"></button>
          <button class="rb" data-action="clearFormat" data-icon="clear" title="Clear all formatting (Ctrl+\)"></button>
        </div>
        <div class="line">
          <button class="rb" data-cmd="bold" data-state data-icon="bold" title="Bold (Ctrl+B)"></button>
          <button class="rb" data-cmd="italic" data-state data-icon="italic" title="Italic (Ctrl+I)"></button>
          <button class="rb" data-cmd="underline" data-state data-icon="underline" title="Underline (Ctrl+U)"></button>
          <button class="rb" data-cmd="strikeThrough" data-state data-icon="strike" title="Strikethrough"></button>
          <button class="rb" data-cmd="subscript" data-state data-icon="sub" title="Subscript"></button>
          <button class="rb" data-cmd="superscript" data-state data-icon="sup" title="Superscript"></button>
          <span class="split" style="margin-left:6px">
            <button class="rb" data-action="applyFore" data-icon="fontcolor" title="Font color"><i class="bar" id="barFore"></i></button>
            <button class="rb arrow" data-popup="fore" data-icon="chev" title="Font color options" aria-label="Font color options"></button>
          </span>
          <span class="split">
            <button class="rb" data-action="applyBack" data-icon="highlight" title="Text highlight color"><i class="bar" id="barBack" style="background:#ff0"></i></button>
            <button class="rb arrow" data-popup="back" data-icon="chev" title="Highlight options" aria-label="Highlight options"></button>
          </span>
        </div>
      </div></div>
      <div class="gl">Font</div>
    </div>

    <div class="group">
      <div class="gi"><div class="rows">
        <div class="line">
          <button class="rb" data-cmd="insertUnorderedList" data-state data-icon="bullets" title="Bullets (Ctrl+Shift+L)"></button>
          <button class="rb" data-cmd="insertOrderedList" data-state data-icon="numbered" title="Numbering"></button>
          <button class="rb" data-cmd="outdent" data-icon="outdent" title="Decrease indent"></button>
          <button class="rb" data-cmd="indent" data-icon="indent" title="Increase indent"></button>
          <button class="rb" data-popup="spacing" data-icon="linespace" title="Line spacing"></button>
        </div>
        <div class="line">
          <button class="rb" data-cmd="justifyLeft" data-state data-icon="alignL" title="Align left (Ctrl+L)"></button>
          <button class="rb" data-cmd="justifyCenter" data-state data-icon="alignC" title="Center (Ctrl+E)"></button>
          <button class="rb" data-cmd="justifyRight" data-state data-icon="alignR" title="Align right (Ctrl+R)"></button>
          <button class="rb" data-cmd="justifyFull" data-state data-icon="alignJ" title="Justify (Ctrl+J)"></button>
        </div>
      </div></div>
      <div class="gl">Paragraph</div>
    </div>

    <div class="group">
      <div class="gi"><div class="gallery">
        <button class="tile" data-style="normal"><span style="font-size:15px">AaBbCc</span><span class="nm">Normal</span></button>
        <button class="tile" data-style="title"><span style="font-size:19px;font-weight:300">AaB</span><span class="nm">Title</span></button>
        <button class="tile" data-style="subtitle"><span style="font-size:13px;color:#6a6a6a">AaBbCc</span><span class="nm">Subtitle</span></button>
        <button class="tile" data-style="h1"><span style="font-size:16px;color:#2f5496">AaBbCc</span><span class="nm">Heading 1</span></button>
        <button class="tile" data-style="h2"><span style="font-size:14px;color:#2f5496">AaBbCc</span><span class="nm">Heading 2</span></button>
        <button class="tile" data-style="h3"><span style="font-size:13px;color:#2f5496">AaBbCc</span><span class="nm">Heading 3</span></button>
        <button class="tile" data-style="quote"><span style="font-size:14px;font-style:italic">AaBbCc</span><span class="nm">Quote</span></button>
      </div></div>
      <div class="gl">Styles</div>
    </div>

    <div class="group" style="border-right:0">
      <div class="gi">
        <button class="rb big" data-action="find" data-icon="find" title="Find (Ctrl+F)"><span>Find</span></button>
        <button class="rb big" data-action="replace" data-icon="replace" title="Replace (Ctrl+H)"><span>Replace</span></button>
      </div>
      <div class="gl">Editing</div>
    </div>
  </div>

  <!-- INSERT -->
  <div class="panel" data-panel="insert">
    <div class="group"><div class="gi"><button class="rb big" data-action="pagebreak" data-icon="pagebreak"><span>Page Break</span></button></div><div class="gl">Pages</div></div>
    <div class="group"><div class="gi"><button class="rb big" data-popup="table" data-icon="table"><span>Table</span></button></div><div class="gl">Tables</div></div>
    <div class="group"><div class="gi"><button class="rb big" data-action="image" data-icon="image"><span>Picture</span></button></div><div class="gl">Illustrations</div></div>
    <div class="group">
      <div class="gi">
        <button class="rb big" data-action="link" id="btnLink" data-icon="link" title="Insert link (Ctrl+K)"><span>Link</span></button>
        <button class="rb big" data-cmd="unlink" data-icon="unlink"><span>Remove Link</span></button>
      </div><div class="gl">Links</div>
    </div>
    <div class="group" style="border-right:0">
      <div class="gi">
        <button class="rb big" data-action="hr" data-icon="hr"><span>Horizontal Line</span></button>
        <button class="rb big" data-action="date" data-icon="calendar"><span>Date</span></button>
        <button class="rb big" data-popup="symbols" data-icon="symbol"><span>Symbol</span></button>
      </div><div class="gl">Text</div>
    </div>
  </div>

  <!-- VIEW -->
  <div class="panel" data-panel="view">
    <div class="group">
      <div class="gi">
        <button class="rb big" data-action="layoutPrint" id="vwPrint" data-icon="printlayout"><span>Print Layout</span></button>
        <button class="rb big" data-action="layoutWeb" id="vwWeb" data-icon="weblayout"><span>Web Layout</span></button>
      </div><div class="gl">Views</div>
    </div>
    <div class="group">
      <div class="gi">
        <button class="rb big" data-action="zoomIn" data-icon="zoomin"><span>Zoom In</span></button>
        <button class="rb big" data-action="zoomOut" data-icon="zoomout"><span>Zoom Out</span></button>
        <button class="rb big" data-action="zoomReset" data-icon="zoomreset"><span>100%</span></button>
      </div><div class="gl">Zoom</div>
    </div>
    <div class="group" style="border-right:0">
      <div class="gi"><button class="rb big" data-action="theme" data-icon="contrast"><span>Dark Mode</span></button></div><div class="gl">Theme</div>
    </div>
  </div>

  <!-- TABLE LAYOUT (contextual: appears when the cursor is in a table) -->
  <div class="panel" data-panel="table">
    <div class="group">
      <div class="gi">
        <button class="rb big" data-action="rowAbove" data-icon="rowabove"><span>Insert Above</span></button>
        <button class="rb big" data-action="rowBelow" data-icon="rowbelow"><span>Insert Below</span></button>
        <button class="rb big" data-action="colLeft" data-icon="colleft"><span>Insert Left</span></button>
        <button class="rb big" data-action="colRight" data-icon="colright"><span>Insert Right</span></button>
      </div><div class="gl">Rows &amp; Columns</div>
    </div>
    <div class="group">
      <div class="gi">
        <button class="rb big" data-action="delRow" data-icon="delrow"><span>Delete Row</span></button>
        <button class="rb big" data-action="delCol" data-icon="delcol"><span>Delete Column</span></button>

  /* ============================== 8. COLORS ============================== */
  const SENTINEL = 'rgb(1, 2, 3)';       // marks "automatic / no color" requests

  function shade(hex, p) {
    const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;

    r = Math.round(r + (t - r) * k); g = Math.round(g + (t - g) * k); b = Math.round(b + (t - b) * k);

  /* ============================== 9. TABLES ============================== */
  function currentCell() { const el = anchorElement(), c = el && el.closest('td,th'); return c && editor.contains(c) ? c : null; }
  function insertTable(rows, cols) {
    let h = '<table><tbody>';

  const T = {
    row(after) {

      mutate(() => {
        const tr = c.parentElement, n = tr.cloneNode(false);
        Array.from(tr.cells).forEach(() => { const td = document.createElement('td'); td.innerHTML = '<br>'; n.appendChild(td); });
        if (after) tr.after(n); else tr.before(n);
        setCaretIn(n.cells[0]);

    },
    col(after) {
      restoreSelection(); const c = currentCell(); if (!c) return;
      mutate(() => {
        const idx = c.cellIndex, table = c.closest('table'); let target = null;
        Array.from(table.rows).forEach((r) => {
          const cell = r.insertCell(Math.min(after ? idx + 1 : idx, r.cells.length)); cell.innerHTML = '<br>';

    delRow() {

        if (!tb.rows.length) tb.remove();

    shade(color) {

    }

  /* ====================== 10. IMAGES, LINKS, PASTE ====================== */
  function readImage(file) {                    // downscale big pictures so localStorage does not fill up
    return new Promise((resolve) => {
      const fr = new FileReader();
      fr.onload = () => {
        const raw = String(fr.result);
        if (/svg|gif/.test(file.type)) return resolve(raw);
        const img = new Image();
        img.onload = () => {
          const MAX = 1400; if (img.width <= MAX && file.size < 500000) return resolve(raw);
          const k = Math.min(1, MAX / img.width), c = document.createElement('canvas');
          c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', 0.85));
        };
        img.onerror = () => resolve(raw); img.src = raw;
      };
      fr.readAsDataURL(file);
    });
  }
  async function insertImageFile(file) {
    if (!file || !/^image\//.test(file.type)) return;
    const url = await readImage(file); exec('insertImage', url);
  }
  function selectImage(img) {

    selectedImg = img; if (img) img.setAttribute('data-sel', '1');

  /** Remove anything dangerous from imported / pasted HTML. */
  function sanitize(root) {
    $$('script,style,iframe,object,embed,link,meta,base,frame,frameset,applet,noscript,template,svg,math,form', root).forEach((n) => n.remove());
    $$('*', root).forEach((el) => {
      Array.from(el.attributes).forEach((a) => {
        const n = a.name.toLowerCase(), v = a.value.replace(/[\s\u0000-\u001f]/g, '').toLowerCase();
        if (n.startsWith('on') || n === 'srcdoc' || n === 'formaction' || n === 'contenteditable' || n === 'data-sel') el.removeAttribute(a.name);
        else if (n === 'class') {
          const keep = a.value.split(/\s+/).filter((c) => SAFE_CLASSES.indexOf(c) > -1).join(' ');
          if (keep) el.setAttribute('class', keep); else el.removeAttribute('class');
        } else if ((n === 'href' || n === 'src' || n === 'xlink:href') && /^(javascript|vbscript|data:text|data:application)/.test(v)) el.removeAttribute(a.name);
        else if (n === 'href' && v.startsWith('data:')) el.removeAttribute(a.name);
      });
    });
    $$('.page-break', root).forEach((p) => p.setAttribute('contenteditable', 'false'));
  }

  function openLinkDialog() {

    const selText = s.rangeCount ? s.toString() : '';

    $('#lkText', body).value = existing ? existing.textContent : selText;

      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); document.execCommand('unlink'); afterChange();
    } });

  /* ========================== 11. FIND & REPLACE ========================== */
  const F = { matches: [], idx: -1 };
  const hasHL = () => !!(window.CSS && CSS.highlights && window.Highlight);
  function blockAt(nodes, off) {
    const t = nodes.find((x) => off >= x.s && off < x.e);
    return t ? (t.n.parentElement.closest(BLOCKS) || editor) : null;
  }
  function findAll() {
    const q = $('#fQ').value; if (!q) return [];
    const cs = $('#fCase').checked, { nodes } = textNodes();
    const full = nodes.map((t) => t.n.data).join(''), hay = cs ? full : full.toLowerCase(), nd = cs ? q : q.toLowerCase();
    const out = []; let i = 0;
    while ((i = hay.indexOf(nd, i)) !== -1) { out.push({ s: i, e: i + nd.length }); i += nd.length; }
    return out.filter((m) => blockAt(nodes, m.s) === blockAt(nodes, m.e - 1));   // no matches across paragraphs
  }

    if (!hasHL()) return;
    CSS.highlights.delete('lw-find'); CSS.highlights.delete('lw-cur');
    if (!F.matches.length) return;
    CSS.highlights.set('lw-find', new Highlight(...F.matches.slice(0, 500).map((m) => rangeFromOffsets(m.s, m.e))));
    if (F.idx >= 0) CSS.highlights.set('lw-cur', new Highlight(rangeFromOffsets(F.matches[F.idx].s, F.matches[F.idx].e)));
  }
  function showCurrent() {
    const n = F.matches.length;
    $('#fCount').textContent = $('#fQ').value ? (n ? (F.idx + 1) + ' of ' + n : 'No results') : '';

    if (F.idx < 0) return;
    const m = F.matches[F.idx], r = rangeFromOffsets(m.s, m.e), el = r.startContainer.parentElement;
    if (!hasHL()) { editor.focus({ preventScroll: true }); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  function openFind(withReplace) {
    const fb = $('#findbar'); fb.classList.add('open');

  function closeFind() {

  }

  /* =================== 12. PERSISTENCE, EXPORT, IMPORT =================== */

    const s = getSelection(); let sw = 0;
    if (s.rangeCount && !s.isCollapsed && editor.contains(s.anchorNode)) { const t = s.toString().trim(); sw = t ? (t.match(/\S+/g) || []).length : 0; }
    $('#stWords').textContent = sw ? sw + ' of ' + docWords + ' words' : docWords + (docWords === 1 ? ' word' : ' words');
    const web = document.body.classList.contains('web') || innerWidth <= 860, el = $('#stPage');
    if (web) { el.style.display = 'none'; return; }
    el.style.display = '';
    const pr = page.getBoundingClientRect(), scale = pr.width / 816 || 1;
    const total = Math.max(1, Math.ceil((pr.height / scale - 2) / 1056));
    let cur = 1, a = anchorElement();
    if (a) cur = Math.min(total, Math.max(1, Math.floor(((a.getBoundingClientRect().top - pr.top) / scale) / 1056) + 1));
    el.textContent = 'Page ' + cur + ' of ' + total;
  }

  /* ============== 14. ACTIONS, KEYBOARD SHORTCUTS, INITIALIZATION ============== */
  const ACTIONS = {
    new: newDocument, import: () => $('#fileInput').click(), save: saveNow,
    exportHtml, exportTxt, exportDoc, print: printDoc, theme: toggleTheme,
    find: () => openFind(false), replace: () => openFind(true),
    findNext: () => stepFind(1), findPrev: () => stepFind(-1), findClose: closeFind, replaceOne, replaceAll,
    link: openLinkDialog, image: () => $('#imgInput').click(),
    hr: () => exec('insertHorizontalRule'),
    pagebreak: () => exec('insertHTML', '<div class="page-break" contenteditable="false"></div><p><br></p>'),
    date: () => exec('insertText', new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' })),
    grow: () => stepSize(1), shrink: () => stepSize(-1), clearFormat: clearFormatting,
    applyFore: () => applyColor('fore', last.fore), applyBack: () => applyColor('back', last.back),
    zoomIn: () => setZoom(zoom + 10), zoomOut: () => setZoom(zoom - 10), zoomReset: () => setZoom(100),
    layoutPrint: () => setLayout('print'), layoutWeb: () => setLayout('web'),
    rowAbove: () => T.row(false), rowBelow: () => T.row(true), colLeft: () => T.col(false), colRight: () => T.col(true),
    delRow: T.delRow, delCol: T.delCol, delTable: T.delTable,
    imgSize: (arg) => { if (!selectedImg) return; const img = selectedImg;
      mutate(() => { img.removeAttribute('height'); if (arg === 'orig') img.style.width = ''; else { img.style.width = arg + '%'; img.style.height = 'auto'; } if (!img.getAttribute('style')) img.removeAttribute('style'); }); },
    imgDelete: () => { if (!selectedImg) return; const img = selectedImg; selectImage(null); mutate(() => img.remove()); }
  };

  /** Build the popup menus once at start-up. */
  function buildPopups() {
    // File menu
    const file = makePopup('file'); file.style.minWidth = '230px';
    [['newdoc', 'New document', 'new'], ['open', 'Import .html / .txt...', 'import'], ['save', 'Save   (Ctrl+S)', 'save'], null,
     ['download', 'Export as HTML (.html)', 'exportHtml'], ['download', 'Export as text (.txt)', 'exportTxt'],
     ['doc', 'Export as Word (.doc)', 'exportDoc'], ['print', 'Print / Save as PDF', 'print']].forEach((it) => {
      if (!it) { file.appendChild(mk('div', 'mdiv')); return; }
      const b = mk('button', 'mi'); b.dataset.action = it[2]; b.dataset.icon = it[0]; b.appendChild(mk('span', '', it[1])); file.appendChild(b);
    });
    injectIcons(file);

    // Colors
    fillPalette(makePopup('fore'), [{ title: 'Theme colors', colors: themeGrid(), cols: 10 }, { title: 'Standard colors', colors: STD, cols: 10 }], 'Automatic', (c) => applyColor('fore', c));
    fillPalette(makePopup('back'), [{ title: 'Highlight colors', colors: HL, cols: 5 }], 'No color', (c) => applyColor('back', c));
    fillPalette(makePopup('shade'), [{ title: 'Theme colors', colors: themeGrid(), cols: 10 }, { title: 'Standard colors', colors: STD, cols: 10 }], 'No shading', (c) => T.shade(c));

    // Font sizes
    const sizes = makePopup('sizes'); sizes.style.minWidth = '70px';
    SIZES.forEach((n) => { const b = mk('button', 'mi', String(n)); b.style.padding = '5px 18px'; b.addEventListener('click', () => { closePopups(); setFontSize(n); }); sizes.appendChild(b); });

    // Line spacing
    const sp = makePopup('spacing');
    ['1.0', '1.15', '1.5', '2.0', '2.5', '3.0'].forEach((v) => { const b = mk('button', 'mi', v); b.addEventListener('click', () => { closePopups(); setLineSpacing(v); }); sp.appendChild(b); });

    // Table size picker (10 x 8 grid)
    const tp = makePopup('table'), grid = mk('div', 'tgrid'), label = mk('div', 'tlabel', 'Insert table'); const cells = [];
    for (let r = 1; r <= 8; r++) for (let c = 1; c <= 10; c++) {
      const g = mk('div', 'tg'); g.dataset.r = r; g.dataset.c = c; cells.push(g); grid.appendChild(g);
    }
    const hover = (r, c) => { cells.forEach((g) => g.classList.toggle('on', +g.dataset.r <= r && +g.dataset.c <= c)); label.textContent = c + ' x ' + r + ' table'; };
    grid.addEventListener('mouseover', (e) => { if (e.target.dataset.r) hover(+e.target.dataset.r, +e.target.dataset.c); });
    grid.addEventListener('click', (e) => { if (e.target.dataset.r) { const r = +e.target.dataset.r, c = +e.target.dataset.c; closePopups(); insertTable(r, c); } });
    tp.appendChild(grid); tp.appendChild(label);

    // Symbols
    const sy = makePopup('symbols'), sg = mk('div', 'sgrid');
    '\u00A9 \u00AE \u2122 \u00A7 \u00B6 \u2020 \u2021 \u2022 \u2026 \u2013 \u2014 \u2018 \u2019 \u201C \u201D \u00AB \u00BB \u00B0 \u00B1 \u00D7 \u00F7 \u2260 \u2264 \u2265 \u2248 \u221E \u00B5 \u03C0 \u03A3 \u03A9 \u03B1 \u03B2 \u03B3 \u03B4 \u20AC \u00A3 \u00A5 \u00A2 \u2190 \u2192 \u2191 \u2193 \u00BD \u00BC \u00BE'.split(' ').forEach((ch) => {
      const b = mk('button', '', ch); b.addEventListener('click', () => { closePopups(); exec('insertText', ch); }); sg.appendChild(b);
    });
    sy.appendChild(sg);
  }

  function onKeydown(e) {
    const inEditor = editor.contains(e.target);
    if (e.key === 'Escape') {
      if ($('#modalRoot').classList.contains('open')) closeModal(); else if (openPop) closePopups();
      else if ($('#findbar').classList.contains('open')) closeFind();
      return;
    }
    // Tab inside tables / lists
    if (inEditor && e.key === 'Tab' && !e.ctrlKey && !e.metaKey && !e.altKey) {
      const cell = currentCell(), el = anchorElement();
      if (cell) {
        e.preventDefault();
        const all = Array.from(cell.closest('table').rows).reduce((a, r) => a.concat(Array.from(r.cells)), []);
        const i = all.indexOf(cell) + (e.shiftKey ? -1 : 1);
        if (i < 0) return; if (i >= all.length) T.row(true); else { setCaretIn(all[i]); saveSelection(); scheduleUI(); }
      } else if (el && el.closest('li')) { e.preventDefault(); exec(e.shiftKey ? 'outdent' : 'indent'); }
      else if (!e.shiftKey) { e.preventDefault(); exec('insertText', '\u00A0\u00A0\u00A0\u00A0'); }
      return;
    }
    const mod = e.ctrlKey || e.metaKey; if (!mod) return;
    const k = e.key.toLowerCase();
    if (k === 's' && !e.shiftKey) { e.preventDefault(); saveNow(); return; }
    if (!inEditor) return;
    const heading = /^Digit([123])$/.exec(e.code);
    if (e.altKey) { if (heading) { e.preventDefault(); setStyle('h' + heading[1]); } return; }
    const fmt = { b: 'bold', i: 'italic', u: 'underline' };
    if (fmt[k] && !e.shiftKey) { e.preventDefault(); exec(fmt[k]); }
    else if (k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if (k === 'y') { e.preventDefault(); redo(); }
    else if (k === 'k') { e.preventDefault(); openLinkDialog(); }
    else if (k === 'f') { e.preventDefault(); openFind(false); }
    else if (k === 'h') { e.preventDefault(); openFind(true); }
    else if (k === 'l' && e.shiftKey) { e.preventDefault(); exec('insertUnorderedList'); }
    else if (k === 'l') { e.preventDefault(); exec('justifyLeft'); }
    else if (k === 'e') { e.preventDefault(); exec('justifyCenter'); }
    else if (k === 'r') { e.preventDefault(); exec('justifyRight'); }
    else if (k === 'j') { e.preventDefault(); exec('justifyFull'); }
    else if (e.key === ']') { e.preventDefault(); stepSize(1); }
    else if (e.key === '[') { e.preventDefault(); stepSize(-1); }
    else if (e.key === '\\') { e.preventDefault(); clearFormatting(); }
  }

  function init() {
    document.execCommand('styleWithCSS', false, true);              // colors/fonts as CSS spans
    document.execCommand('defaultParagraphSeparator', false, 'p');  // Enter creates <p>
    injectIcons(); buildPopups(); loadTheme(); loadSaved(); histInit();

    // Font family list (each option previews its own font)
    Object.keys(FONTS).forEach((n) => { const o = mk('option', '', n); o.value = n; o.style.fontFamily = FONTS[n]; $('#selFont').appendChild(o); });
    $('#selFont').addEventListener('change', (e) => setFont(e.target.value));
    $('#inpSize').addEventListener('change', (e) => setFontSize(e.target.value));
    $('#inpSize').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); setFontSize(e.target.value); } });
    $('#docTitle').addEventListener('input', () => { syncTitle(); onChange(); });
    $('#docTitle').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); editor.focus(); } });
    $('#zoom').addEventListener('input', (e) => setZoom(+e.target.value));

    // Ribbon buttons keep the editor selection when pressed (no focus steal)
    $$('.rb,.tab,.tile,.zb').forEach((b) => b.addEventListener('mousedown', (e) => e.preventDefault()));

    // One delegated click handler wires every button
    document.addEventListener('click', (e) => {
      const b = e.target.closest('[data-popup],[data-action],[data-cmd],[data-style],[data-tab]'); if (!b) return;
      if (b.dataset.popup) { togglePopup(b.dataset.popup, b); return; }
      const inPopup = !!b.closest('.popup');
      if (b.dataset.tab) setTab(b.dataset.tab);
      else if (b.dataset.style) setStyle(b.dataset.style);
      else if (b.dataset.action) { const fn = ACTIONS[b.dataset.action]; if (fn) fn(b.dataset.arg, b); }
      else if (b.dataset.cmd) { if (b.dataset.cmd === 'undo') undo(); else if (b.dataset.cmd === 'redo') redo(); else exec(b.dataset.cmd); }
      if (inPopup) closePopups();
    });
    document.addEventListener('mousedown', (e) => {                       // click-away closes popups
      if (openPop && !e.target.closest('.popup') && !e.target.closest('[data-popup]')) closePopups();
    }, true);
    $('#modalRoot').addEventListener('mousedown', (e) => { if (e.target.id === 'modalRoot') closeModal(); });
    window.addEventListener('resize', () => { closePopups(); scheduleUI(); });

    // Find bar
    $('#fQ').addEventListener('input', () => runFind());
    $('#fCase').addEventListener('change', () => runFind());
    $('#fQ').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); stepFind(e.shiftKey ? -1 : 1); } });
    $('#fR').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); replaceOne(); } });

    // Import / images
    $('#fileInput').addEventListener('change', (e) => { importFile(e.target.files[0]); e.target.value = ''; });
    $('#imgInput').addEventListener('change', (e) => { Array.from(e.target.files).forEach(insertImageFile); e.target.value = ''; });

    // Editor events
    editor.addEventListener('input', (e) => {
      if (selectedImg) { selectedImg.removeAttribute('data-sel'); selectedImg = null; }
      if (e.inputType === 'insertParagraph') {                 // Enter after a Title/Subtitle returns to Normal
        const el = anchorElement(), b = el && el.closest('p');
        if (b && (b.classList.contains('title') || b.classList.contains('subtitle')) && !b.textContent.trim()) b.removeAttribute('class');
      }
      histSchedule(); onChange(); scheduleUI();
    });
    editor.addEventListener('beforeinput', (e) => {            // route context-menu / mobile undo to our history
      if (e.inputType === 'historyUndo') { e.preventDefault(); undo(); }
      else if (e.inputType === 'historyRedo') { e.preventDefault(); redo(); }
    });
    editor.addEventListener('mousedown', (e) => { selectImage(e.target.tagName === 'IMG' ? e.target : null); });
    editor.addEventListener('click', (e) => {
      const a = e.target.closest('a');
      if (a && (e.ctrlKey || e.metaKey)) window.open(a.href, '_blank', 'noopener');   // Ctrl+click opens links
      scheduleUI();
    });
    editor.addEventListener('keyup', scheduleUI);
    editor.addEventListener('paste', (e) => {                  // sanitized paste
      const cd = e.clipboardData; if (!cd) return;
      const files = Array.from(cd.files || []).filter((f) => /^image\//.test(f.type)), html = cd.getData('text/html');
      if (files.length && !html) { e.preventDefault(); files.forEach(insertImageFile); return; }
      if (html) { e.preventDefault(); const d = new DOMParser().parseFromString(html, 'text/html'); sanitize(d.body); exec('insertHTML', d.body.innerHTML); }
    });
    editor.addEventListener('dragover', (e) => { if (e.dataTransfer && Array.from(e.dataTransfer.types).indexOf('Files') > -1) e.preventDefault(); });
    editor.addEventListener('drop', (e) => {
      const files = Array.from((e.dataTransfer && e.dataTransfer.files) || []).filter((f) => /^image\//.test(f.type));
      if (files.length) { e.preventDefault(); files.forEach(insertImageFile); }
    });
    document.addEventListener('keydown', onKeydown);
    document.addEventListener('selectionchange', () => { saveSelection(); scheduleUI(); });
    window.addEventListener('beforeunload', saveNow);
    window.addEventListener('beforeprint', () => { if (hasHL()) { CSS.highlights.delete('lw-find'); CSS.highlights.delete('lw-cur'); } });

    // Restore view preferences
    let z = 100, l = 'print';
    try { z = parseInt(localStorage.getItem(KEY_ZOOM), 10) || 100; l = localStorage.getItem(KEY_LAYOUT) || 'print'; } catch (e) { /* ignore */ }
    setZoom(z); setLayout(l); setSave('Saved'); updateCounts(); scheduleUI();
  }
  init();
})();
</script>
</body>
